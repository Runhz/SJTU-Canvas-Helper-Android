name: Android project quality
on:
  push:
    branches: [android]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  frontend:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.14.0'
          cache: npm
          cache-dependency-path: demo/package-lock.json
      - run: npm ci --prefix demo
      - run: npm --prefix demo test
      - run: npm --prefix demo run build
      - run: npm --prefix demo run test:encoding
      - run: node tools/check-public-source.mjs
      - run: node --test tools/public-source.test.mjs
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path tools/ai-core-tests/Cargo.toml
  # This workflow tests UI/core logic. It does not assert Android or account acceptance.
