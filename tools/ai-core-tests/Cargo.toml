[package]
name = "canvas-ai-core-checks"
version = "0.1.0"
edition = "2021"

[dependencies]
zip = { version = "0.6.6", default-features = false, features = ["deflate"] }
quick-xml = "0.37.5"
encoding_rs = "0.8"
cfb = "0.10"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
reqwest = { version = "0.11.24", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures = "0.3"
tokio = { version = "1.48", features = ["full"] }
pdf-extract = "0.10.0"
